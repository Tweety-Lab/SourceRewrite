<head>
    <link rel="stylesheet" href="file:///themes/legacy.css">
    <script src="file:///elements/panels.js"></script>

    <style>
        #console {
            height: 300px;
            width: 500px;
        }

        #log-area {
            width: 100%;
            height: 70%;

            overflow: auto;
            
            padding: 4px;

            min-height: 120px;
            min-width: 100px;

            margin-bottom: 10px;

            background-color: var(--bg-dark);
            font-family: var(--font-primary); /* Apply the primary font */
            color: var(--text-white);
            font-size: 12px;

            border-left: 1px solid #252525;
            border-top: 1px solid #252525;
            border-right: 1px solid #a8a8a8;
            border-bottom: 1px solid #a8a8a8;

            outline: none;
        }

        vista-panel {
            display: flex;          /* Enable flexbox */
            flex-direction: column; /* Stack child divs vertically */
        }

        vista-panel > div {
            display: flex;          /* Enable flexbox inside each div */
            align-items: center;    /* Vertically center content */
            justify-content: flex-start; /* Align items from left to right */
            margin-bottom: 10px;    /* Add space between divs */
        }

        input, button {
            margin-right: 10px; /* Add space between input and button */
        }
        
        button {
            margin-bottom: 2px;
        }

    </style>
</head>

<body>
    <vista-panel id="console">
        <div>
            <p>Console</p>
        </div>

        <div>
            <div id="log-area" readonly></div>
        </div>

        <div>
            <input type="text" id="command-input">
            <button id="submit-button" onclick="SubmitCommand(document.getElementById('command-input').value); document.getElementById('command-input').value = ''">Submit</button>
        </div>
    </vista-panel>
</body>
