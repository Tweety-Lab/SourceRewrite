<head>
    <link rel="stylesheet" href="file:///editor/styles/editor.css">
</head>
<body>
    <div class="menu-bar">
        <button onclick="toggleContent(event, 'file-functions-content')">File</button>
        <button onclick="toggleContent(event, 'help-content')">Help</button>
    </div>

    <div class="action-bar">
        <div id="selection-content">
            <p>Select:</p>
            <button class="selected-button">Groups</button>
            <button onclick="TestFunc(12)">Objects</button>
            <button>Solids</button>
        </div>
    </div>

    <div class="play-buttons">
        <button onclick="PlayGame()"><img src="file:///editor/images/play.svg"></button>
        <button onclick="PlayCurrentMap()"><img src="file:///editor/images/play_current.svg"></button>
    </div>

    <div class="toolbar-vertical">
        <button class="selected-button"><img src="file:///editor/images/toolbar/select_tool.png"></button>
        <button><img src="file:///editor/images/toolbar/magnify_tool.png"></button>
        <button><img src="file:///editor/images/toolbar/camera_tool.png"></button>
        <hr>
        <button><img src="file:///editor/images/toolbar/entity_tool.png"></button>
        <button><img src="file:///editor/images/toolbar/block_tool.png"></button>
        <hr>
        <button><img src="file:///editor/images/toolbar/texture_app.png"></button>
        <button><img src="file:///editor/images/toolbar/texture_apply.png"></button>
        <button><img src="file:///editor/images/toolbar/decal_apply.png"></button>
        <button><img src="file:///editor/images/toolbar/overlay_apply.png"></button>
        <hr>
        <button><img src="file:///editor/images/toolbar/clipping_tool.png"></button>
        <button>Vertex</button>
    </div>

    <div id="file-functions-content" class="menu-content">
        <button>New</button>
        <button onclick="OpenMap()">Open Map...</button>
        <button>Save Map As...</button>
        <hr>
        <button onclick="CloseMap()">Close</button>
    </div>

    <div id="help-content" class="menu-content">
        <button onclick="OpenVDC()">Valve Developer Community</button>
    </div>

    <script src="file:///editor/scripts/editor.js"></script>
</body>
