<head>
    <link rel="stylesheet" href="file:///editor/styles/editor.css">
</head>
<body>
    <div class="menu-bar">
        <button onclick="toggleContent(event, 'file-functions-content')">File</button>
        <button onclick="toggleContent(event, 'light-editor-content')">Light Editor</button>
        <button onclick="toggleContent(event, 'help-content')">Help</button>
    </div>

    <div class="play-buttons">
        <button onclick="PlayGame()"><img src="file:///editor/images/play.svg"></button>
        <button onclick="PlayCurrentMap()"><img src="file:///editor/images/play_current.svg"></button>
    </div>

    <div class="toolbar-vertical">
        <button>Select</button>
        <button>Magnify</button>
        <button>Camera</button>
        <hr>
        <button>Entity</button>
        <button>Block</button>
        <hr>
        <button>Text App</button>
        <button>Apply Text</button>
        <button>Apply Dec</button>
        <button>Apply Over</button>
        <hr>
        <button>Clipping</button>
        <button>Vertex</button>
    </div>

    <div id="file-functions-content" class="menu-content">
        <button>New</button>
        <button onclick="OpenMap()">Open Map...</button>
        <button>Save Map As...</button>
        <hr>
        <button onclick="CloseMap()">Close</button>
    </div>

    <div id="light-editor-content" class="menu-content">
        <button onclick="OpenLightEditor()">Start</button>
        <button onclick="CloseLightEditor()">Close</button>
        <hr>
        <button>Info</button>
    </div>

    <div id="help-content" class="menu-content">
        <button onclick="OpenVDC()">Valve Developer Community</button>
    </div>


    <script>
        // Function to toggle the menu content when a button is clicked
        function toggleContent(event, contentId) {
            // Get the button that was clicked
            const button = event.target;

            // Get the button's position relative to the document
            const rect = button.getBoundingClientRect();

            // Get all menu content elements
            const allContents = document.querySelectorAll('.menu-content');

            // Loop through all content and hide them
            allContents.forEach(content => content.style.display = 'none');

            // Get the content to display
            const selectedContent = document.getElementById(contentId);
            if (selectedContent) {
                // Position the content below the button
                selectedContent.style.left = rect.left + 'px';
                selectedContent.style.top = rect.bottom + 'px';
                selectedContent.style.display = 'flex';  // Show the selected content
            }

            // Stop the event from propagating (so it doesn't trigger the document click listener)
            event.stopPropagation();
        }

        // Function to hide all menu content
        function hideAllMenus() {
            const allContents = document.querySelectorAll('.menu-content');
            allContents.forEach(content => content.style.display = 'none');
        }

        // Add a click event listener to the document to close all menus if clicked outside
        document.addEventListener('click', function (event) {
            if (!event.target.closest('.menu-bar')) {
                hideAllMenus();
            }
        });
    </script>
</body>
