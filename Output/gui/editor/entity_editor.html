<head>
    <link rel="stylesheet" href="file:///editor/styles/themes/lavender.css">
    <link rel="stylesheet" href="file:///editor/styles/editor.css">
    <style>
        body {
            color: white;
            font-family: var(--font-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        p {
            margin-bottom: 2px;
            margin-top: 2px;
        }
        
        .container {
            background-color: #1d1d20;
            display: flex;
            width: 700px;
            height: 450px;
            padding: 10px;
        }
        
        #left-align, #right-align {
            display: flex;
            flex-direction: column;
        }
        
        #left-align {
            padding-right: 5px;
            flex: 2;
        }
        
        #left-align input {
            width: 200px;
        }
        
        #right-align {
            padding-left: 5px;
            flex: 1;
        }
        
        #right-align input {
            margin-top: 84px;
        }
        
        #keyvalues-holder {
            border: 1px solid var(--button-border);
            overflow-y: auto;
            flex-grow: 1;
        }
        
        textarea {
            height: 120px;
        }
        
        #entity-help {
            height: 150px;
        }

        #exit-button {
            width: 50px;
            height: 50px;
            margin-left: auto; /* Push the button to the right */
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        td {
            height: 5px;
            border: 1px solid var(--bg-medium);
            padding-left: 6px;
        }

        #keyvalues-table #first-row td {
            border-top: 1px solid var(--accent);
            border-left: 1px solid var(--accent);
            border-right: 1px solid var(--accent);
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="left-align">
            <p>Object Properties: Entity Class Name</p>
            <br>
            <p>Class:</p>
            <input type="text" id="class-name">
            <p>Keyvalues:</p>
            <div id="keyvalues-holder">
                <table id="keyvalues-table">
                    <tr id="first-row">
                        <td>Property Name</td>
                        <td>Value</td>
                    </tr>
                    <tr>
                        <td>Name</td>
                        <td><input type="text" onkeypress="KeyValueChanged('Name', value)"></td>
                    </tr>
                </table>
            </div>
        </div>
        
        <div id="right-align">
            <button id="exit-button" onclick="Quit()">Quit</button>
            <input type="text">
            <br>
            <br>
            <p>Help</p>
            <textarea readonly id="entity-help">Entity Help Information</textarea>
            <p>Comments</p>
            <textarea></textarea>
        </div>
    </div>
</body>
