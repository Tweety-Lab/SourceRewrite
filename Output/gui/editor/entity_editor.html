<head>
    <link rel="stylesheet" href="file:///editor/styles/themes/lavender.css">
    <link rel="stylesheet" href="file:///editor/styles/editor.css">
    <style>
        body {
            color: white;
            font-family: var(--font-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        p {
            margin-bottom: 2px;
            margin-top: 2px;
        }
        
        .container {
            background-color: #1d1d20;
            display: flex;
            width: 700px;
            height: 450px;
            padding: 10px;
        }
        
        #left-align, #right-align {
            display: flex;
            flex-direction: column;
        }
        
        #left-align {
            padding-right: 5px;
            flex: 2;
        }
        
        #left-align input {
            width: 200px;
        }
        
        #right-align {
            padding-left: 5px;
            flex: 1;
        }
        
        #right-align input {
            margin-top: 84px;
        }
        
        #keyvalues-holder {
            border: 1px solid var(--button-border);
            overflow-y: auto;
            flex-grow: 1;
        }
        
        textarea {
            height: 120px;
        }
        
        #entity-help {
            height: 150px;
        }

        #exit-button {
            width: 50px;
            height: 50px;
            margin-left: auto; /* Push the button to the right */
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        td {
            height: 5px;
            border: 1px solid var(--bg-medium);
            padding-left: 6px;
        }

        #keyvalues-table #first-row td {
            border-top: 1px solid var(--accent);
            border-left: 1px solid var(--accent);
            border-right: 1px solid var(--accent);
        }

        #keyvalues-table input {
            border: none;
            outline: none;
            background-color: transparent;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="left-align">
            <p>Object Properties: Entity Class Name</p>
            <br>
            <p>Class:</p>
            <input type="text" id="class-name">
            <p>Keyvalues:</p>
            <div id="keyvalues-holder">
                <table id="keyvalues-table">
                    <tr id="first-row">
                        <td>Property Name</td>
                        <td>Value</td>
                    </tr>
                    <tr>
                        <td>Name</td>
                        <td><input type="text" onkeyup="KeyValueChanged('Name', this.value)"></td>
                    </tr>
                </table>
            </div>
        </div>
        
        <div id="right-align">
            <button id="exit-button" onclick="Quit()">Quit</button>
            <input type="text">
            <br>
            <br>
            <p>Help</p>
            <textarea readonly id="entity-help">Entity Help Information</textarea>
            <p>Comments</p>
            <textarea></textarea>
        </div>
    </div>
    <script>
        // Function to make an element draggable
        function makeDraggable(element) {
            let offsetX = 0, offsetY = 0, mouseX = 0, mouseY = 0;
            let dragging = false;
    
            // Mouse down event to start dragging
            element.onmousedown = function(e) {
                // Check if the mouse is over an input or button element
                if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'button' || e.target.tagName.toLowerCase() === 'textarea') {
                    return; // Don't start dragging
                }
    
                e.preventDefault(); // Prevent default action
                dragging = true;

                // Get the mouse position at the start of the drag
                mouseX = e.clientX;
                mouseY = e.clientY;
    
                // Calculate the current offset
                document.onmousemove = function(e) {
                    if (!dragging) return;
                    e.preventDefault();
                    // Calculate new position based on the mouse movement
                    offsetX = mouseX - e.clientX;
                    offsetY = mouseY - e.clientY;
                    mouseX = e.clientX;
                    mouseY = e.clientY;
    
                    // Set the new position of the element
                    const rect = element.getBoundingClientRect();
                    element.style.left = rect.left - offsetX + "px";
                    element.style.top = rect.top - offsetY + "px";
                };
    
                // Stop dragging when the mouse is released
                document.onmouseup = function() {
                    dragging = false;
                    document.onmousemove = null;
                    document.onmouseup = null;
                };
            };
        }
    
        // Make the container draggable
        window.onload = function() {
            const container = document.querySelector('.container');
            container.style.position = "absolute"; // Make sure the container can be moved around
            makeDraggable(container);
        };
    </script>
</body>
