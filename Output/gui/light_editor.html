<head>
    <style>
        body {
            height: 100vh; /* Make sure the background covers the entire viewport height */
            font-family: Arial, sans-serif; /* Set a clean font */
        }

        p, button, div {
            margin: 0; /* Remove default margin from elements */
        }

        p {
            color: rgb(255, 255, 255);
        }

        #disclaimer {
            color: #6d6d6d;
            padding-bottom: 20px;
        }
        
        .editor-panel {
            background: linear-gradient(to bottom, #fc5454 0px, #fc5454 22px, #262626 22px);
            padding: 5px;
            border-radius: 5px;
            display: flex; /* Use flexbox to arrange the content */
            flex-direction: column; /* Stack items vertically */
            gap: 40px; /* Space between items */
            position: absolute; /* Allow panel to be placed anywhere */
            width: fit-content;
        }

        .editor-panel p {
            font-size: small;
        }

        .editor-panel button {
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px;
            margin-top: 5px;
            min-width: 200px;
            background-color: #fc5454;
        }

        .editor-panel button:hover {
            background-color: #dd4444;
        }

        .editor-panel #panel-title {
            display: flex;
            justify-content: center; /* Center the content */
            margin-bottom: 10px;
            width: 100%;
        }

        .editor-panel #panel-title img {
            position: absolute;
            left: 4px; /* Position on the left side */
            top: 0px;
        }

        .editor-panel .editor-section {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        /* Custom Radio Button Styles */
        .custom-radio {
            display: flex; /* Use flexbox to align items horizontally */
            align-items: center; /* Vertically center the radio button and text */
            cursor: pointer;
            margin-top: 5px;
        }

        .custom-radio input {
            display: none; /* Hide the default radio button */
        }

        .custom-radio .radio-button {
            width: 16px;
            height: 16px;
            background-color: #444; /* Dark grey background */
            border-radius: 50%;
            display: inline-block;
            position: relative;
            margin-right: 8px; /* Add space between the radio button and text */
        }

        .custom-radio input:checked + .radio-button::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #fc5454; /* Colored circle */
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .custom-radio .radio-text {
            color: white;
            font-size: 12px;
        }

    </style>
</head>
<body>
    <p id="disclaimer">DEMO CONTENT - TO BE CHANGED</p>

    <div class="editor-panel" id="light-editor-panel">
        <div id="panel-title">
            <img src="file:///images/drop_down_arrow.svg" id="toggle-panel">
            <p>Light Editor</p>
        </div>

        <div class ="editor-section">
            <p>Translation</p>
            <label class="custom-radio">
                <input type="radio" name="translation-button" onclick="PositionMode()">
                <span class="radio-button"></span>
                <span class="radio-text">Position</span>
            </label>
            <label class="custom-radio">
                <input type="radio" name="translation-button" onclick="NoneMode()" checked>
                <span class="radio-button"></span>
                <span class="radio-text">None</span>
            </label>
        </div>

        <div class="editor-section">
            <p>Light Actions</p>
            <button onclick="ToggleLights()">Toggle Lights</button>
            <button onclick="DeleteLights()">Delete Lights</button>
        </div>

        <div class="editor-section">
            <p>Map Actions</p>
            <button onclick="LoadBSP()">Load BSP</button>
            <button>Save To BSP</button>
        </div>

        <p id="current-map">Current Map: </p>
    </div>

    
    <script>
        // Variables for dragging functionality
        let isDragging = false;
        let offsetX = 0, offsetY = 0;
        const editorPanel = document.getElementById("light-editor-panel");
        const panelTitle = document.getElementById("panel-title");
        const toggleButton = document.getElementById("toggle-panel");
    
        // Mouse down event on the panel title to start dragging
        panelTitle.addEventListener("mousedown", function(e) {
            isDragging = true;
            offsetX = e.clientX - editorPanel.getBoundingClientRect().left;
            offsetY = e.clientY - editorPanel.getBoundingClientRect().top;
            editorPanel.style.transition = 'none'; // Disable smooth transition during dragging
        });
    
        // Mouse move event to move the panel
        document.addEventListener("mousemove", function(e) {
            if (isDragging) {
                editorPanel.style.left = `${e.clientX - offsetX}px`;
                editorPanel.style.top = `${e.clientY - offsetY}px`;
            }
        });
    
        // Mouse up event to stop dragging
        document.addEventListener("mouseup", function() {
            isDragging = false;
            editorPanel.style.transition = 'top 0.2s ease, left 0.2s ease'; // Re-enable smooth transition
        });
    
        // Get all elements with the class 'editor-section'
        const editorSections = document.querySelectorAll('.editor-section');
    
        // Toggle panel sections visibility when clicking the drop-down image
        toggleButton.addEventListener("click", function() {
            // Iterate over all the sections and toggle their visibility
            editorSections.forEach(section => {
                // Toggle the display of each section
                const isCollapsed = section.style.display === "none";
                section.style.display = isCollapsed ? "flex" : "none";
            });
        });
    </script>
</body>
