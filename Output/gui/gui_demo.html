<head>
    <style>
        body {
            height: 100vh; /* Make sure the background covers the entire viewport height */
            margin: 0; /* Remove default margin */
            display: flex; /* Use flexbox to layout the content */
            flex-direction: column; /* Stack items left to right */
            justify-content: center; /* Horizontally center the content */
            align-items: center; /* Vertically center the content */
            font-family: Arial, sans-serif; /* Set a clean font */
            position: relative; /* Needed to position the dot relative to the body */
        }

        p {
            color: rgb(0, 0, 0);
        }

        /* Style for the dot that follows the cursor */
        .cursor-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: black;
            border-radius: 50%;
            pointer-events: none; /* Prevent it from interfering with other interactions */
            transform: translate(-50%, -50%); /* Center the dot at the cursor */
        }
    </style>
</head>
<body>
    <p>GUI DEMO</p>
    <button onclick="ButtonPressed()">Click Me</button>
    <p id="output-text">Output</p>

    <img id="hammer-image" src="file:///images/hammer.jpg" alt="Local Photo">

    <!-- Dot element that will follow the cursor -->
    <div class="cursor-dot" id="cursorDot"></div>

    <script>
        // Get the dot element
        const cursorDot = document.getElementById('cursorDot');

        // Update the position of the dot as the mouse moves
        document.addEventListener('mousemove', function(event) {
            cursorDot.style.left = `${event.clientX}px`;
            cursorDot.style.top = `${event.clientY}px`;
        });
    </script>
</body>
