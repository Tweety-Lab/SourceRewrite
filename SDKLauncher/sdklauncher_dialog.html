<head>
    <style>
        body {
            font-family: Tahoma, Geneva, sans-serif; /* Tahoma font with fallback */
            font-weight: normal; /* Ensure normal weight */
            font-style: normal; /* Ensure normal style */
            /* Try to disable anti-aliasing */
            -webkit-font-smoothing: none;
            background-color: #4c5844;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Create a vertical box using Flexbox */
        .vbox {
            display: flex;
            flex-direction: column; /* Align items vertically */
            height: 80%;
            /* Border */
            border-top: 1px solid #282e22;
            border-left: 1px solid #282e22;
            border-right: 1px solid #889180;
            border-bottom: 1px solid #889180;
            /* Positioning */
            position: absolute;
            top: 30px; /* 30px gap from the top */
            bottom: 50px; /* 50px gap from the bottom */
            width: calc(100% - 20px); /* Adjust width to account for borders */
            /* Background Color */
            background-color: #3e4637;
        }

            .vbox > button {
                background-color: transparent;
                border: none;
                text-align: left;
                padding: 5px;
                padding-top: 3px;
                padding-bottom: 3px;
                font-size: small;
                color: #d8ded3;
            }

                .vbox > button.active {
                    background-color: #958831;
                }

            .vbox > p {
                margin-left: 15px;
                margin-bottom: 2px;
                color: #c4b550; /* Text color */
                font-size: x-small;
            }

            .vbox > hr.seperator {
                height: 1px;
                background-color: #282e22;
                border: none;
                /* Margins */
                margin-left: 5px;
                margin-right: 5px;
                margin-top: 0px;
                margin-bottom: 0px;
            }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const buttons = document.querySelectorAll(".vbox > button");

            buttons.forEach(button => {
                button.addEventListener("click", function() {
                    // Remove the "active" class from all buttons
                    buttons.forEach(btn => btn.classList.remove("active"));

                    // Add the "active" class to the clicked button
                    button.classList.add("active");
                });
            });
        });
    </script>
</head>

<body>
    <div class="vbox">
        <p>Applications</p>
        <hr class="seperator">
        <button onclick="OpenHammer()">Hammer World Editor</button>
        <button>Model Viewer</button>
        <button>Face Poser</button>

        <p>Documentation</p>
        <hr class="seperator">
        <button>Getting Started Guide</button>
        <button>Example Content</button>

        <p>Utilities</p>
        <hr class="seperator">
        <button>SketchUp Plugins</button>
    </div>
</body>
